---
# CORENET-7502 CI acceptance checks. This deliberately exercises the product
# role's multihoming tasks directly; the qualification environment can reuse
# this playbook with a different inventory and physical topology.
- name: Configure the two appliance bonds
  hosts: onprem_appliances
  become: true
  gather_facts: false
  vars:
    trunk_interface: bond0
    multihoming:
      enabled: true
      bond_interfaces: [eth1, eth2]
      es_id: "00:aa:bb:cc:dd:ee:ff:00:00:01"
      es_sys_mac: "02:aa:bb:cc:dd:ee"
      df_pref: 32767
    tunnel:
      type: direct-connect
      onprem_ip: 10.44.44.1
      cloud_ip: 10.44.44.2
      network_cidr: 10.44.44.0/24
    bgp:
      onprem_asn: 65044
      infra_asn: 65100
      workload_asn: 65200
    stretches:
      - vlan: 100
        name: production
        subnet: 10.42.1.0/24
        onprem_gateway: 10.42.1.1
        cloud_gateway: 10.42.1.2
      - vlan: 200
        name: staging
        subnet: 10.42.2.0/24
        onprem_gateway: 10.42.2.1
        cloud_gateway: 10.42.2.2
      - vlan: 300
        name: management
        subnet: 10.42.3.0/24
        onprem_gateway: 10.42.3.1
        cloud_gateway: 10.42.3.2
    frr_image: quay.io/frrouting/frr:10.5.3
    # The emulated edge node terminates LACP for both appliance bundles. A
    # qualification inventory can keep this assertion enabled against DVS/MLAG.
    require_lacp_peer: true
  tasks:
    - name: Include the product multihoming implementation
      ansible.builtin.include_role:
        name: network.evpn_gateway.evpn_onprem_appliance
        tasks_from: multihoming.yml

    - name: Include the product physical trunk implementation
      ansible.builtin.include_role:
        name: network.evpn_gateway.evpn_onprem_appliance
        tasks_from: physical.yml

    # The full VTEP role also creates VXLAN interfaces and needs a reachable
    # tunnel endpoint. These small local bridges exercise the product trunk
    # and gateway path independently of that separate transport concern.
    - name: Create local VLAN gateway bridges for the failover check
      ansible.builtin.command: ip link add br-test{{ item.vlan }} type bridge
      loop: "{{ stretches }}"
      register: test_bridge_create
      failed_when: >-
        test_bridge_create.rc != 0 and
        'File exists' not in test_bridge_create.stderr
      changed_when: test_bridge_create.rc == 0

    - name: Attach product trunk VLANs to local gateway bridges
      ansible.builtin.command: ip link set trunk.{{ item.vlan }} master br-test{{ item.vlan }}
      loop: "{{ stretches }}"
      register: test_bridge_attach
      failed_when: >-
        test_bridge_attach.rc != 0 and
        'already a member' not in test_bridge_attach.stderr
      changed_when: test_bridge_attach.rc == 0

    - name: Bring up local gateway bridges
      ansible.builtin.command: ip link set br-test{{ item.vlan }} up
      loop: "{{ stretches }}"
      changed_when: false

    - name: Assign local gateway addresses
      ansible.builtin.command: >-
        ip addr add {{ item.onprem_gateway }}/{{ item.subnet | ansible.utils.ipaddr('prefix') }}
        dev br-test{{ item.vlan }}
      loop: "{{ stretches }}"
      register: test_gateway_ip
      failed_when: >-
        test_gateway_ip.rc != 0 and
        'already' not in test_gateway_ip.stderr and
        'File exists' not in test_gateway_ip.stderr
      changed_when: test_gateway_ip.rc == 0

    - name: Render the product EVPN multihoming configuration
      ansible.builtin.include_role:
        name: network.evpn_gateway.evpn_onprem_appliance
        tasks_from: frr_config.yml

    - name: Read the rendered FRR configuration
      ansible.builtin.slurp:
        src: /etc/frr/frr.conf
      register: frr_config

    - name: Read the negotiated bond state
      ansible.builtin.command: cat /proc/net/bonding/{{ trunk_interface }}
      register: bond_state
      changed_when: false
      retries: 15
      delay: 2
      until:
        - "'Partner Mac Address:' in bond_state.stdout"
        - "'Partner Mac Address: 00:00:00:00:00:00' not in bond_state.stdout"

    - name: Assert both appliances configured the shared Ethernet Segment bond
      ansible.builtin.assert:
        that:
          - "'Bonding Mode: IEEE 802.3ad Dynamic link aggregation' in bond_state.stdout"
          - "'Slave Interface: eth1' in bond_state.stdout"
          - "'Slave Interface: eth2' in bond_state.stdout"
        fail_msg: >-
          {{ inventory_hostname }} did not configure the requested 802.3ad bond with both members.

    - name: Assert both appliances negotiated an upstream LACP peer
      ansible.builtin.assert:
        that:
          - "'Partner Mac Address:' in bond_state.stdout"
          - "'Partner Mac Address: 00:00:00:00:00:00' not in bond_state.stdout"
        fail_msg: >-
          {{ inventory_hostname }} did not negotiate both LACP members with the emulated edge peer.
      when: require_lacp_peer | bool

    - name: Assert the shared Ethernet Segment identity is present in test input
      ansible.builtin.assert:
        that:
          - >-
            'evpn mh es-id 00:aa:bb:cc:dd:ee:ff:00:00:01' in
            (frr_config.content | b64decode)
          - >-
            'evpn mh es-sys-mac 02:aa:bb:cc:dd:ee' in
            (frr_config.content | b64decode)
        fail_msg: >-
          {{ inventory_hostname }} did not render the shared CORENET-7502
          Ethernet Segment identity into FRR configuration.

- name: Verify VLAN reachability before appliance failure
  hosts: edge_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Ping the shared VLAN gateway
      ansible.builtin.command: ping -c 5 -W 1 10.42.1.1
      register: baseline_ping
      changed_when: false
    - name: Assert the edge bridge reaches the active appliance
      ansible.builtin.assert:
        that: baseline_ping.rc == 0

- name: Take one appliance data-plane bond down
  hosts: appliance-a
  become: true
  gather_facts: false
  tasks:
    - name: Disable appliance-a's edge-facing bond
      ansible.builtin.command: ip link set bond0 down
      changed_when: true

- name: Verify the surviving appliance still forwards the VLAN
  hosts: edge_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Flush the old gateway neighbor
      ansible.builtin.command: ip neigh flush dev eth1.100
      changed_when: false
    - name: Ping the gateway after appliance-a failure
      ansible.builtin.command: ping -c 5 -W 1 10.42.1.1
      register: failover_ping
      changed_when: false
    - name: Assert traffic survives appliance-a failure
      ansible.builtin.assert:
        that: failover_ping.rc == 0

- name: Restore appliance-a for deploy-stage inspection
  hosts: appliance-a
  become: true
  gather_facts: false
  tasks:
    - name: Re-enable bond members
      ansible.builtin.command: ip link set {{ item }} up
      loop: [eth1, eth2]
      changed_when: true
    - name: Re-enable appliance-a's bond
      ansible.builtin.command: ip link set bond0 up
      changed_when: true
