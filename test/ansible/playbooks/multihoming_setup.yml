---
# Test-only setup for the emulated relay. The appliance and workload are
# deliberately deployed by network.evpn_gateway.deploy, the production entrypoint.
- name: Configure the emulated EVPN relay
  hosts: evpn_relays
  become: true
  gather_facts: false
  vars:
    frr_image: quay.io/frrouting/frr:10.5.3
  tasks:
    - name: Configure relay underlay interfaces
      ansible.builtin.shell: |
        set -e
        ip link set eth1 up
        ip link set eth2 up
      changed_when: false

    - name: Create relay FRR directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/frr, mode: '0755'}
        - {path: /var/run/frr, mode: '0777'}

    - name: Enable relay BGP daemons
      ansible.builtin.copy:
        dest: /etc/frr/daemons
        mode: "0644"
        content: |
          bgpd=yes
          ospfd=no
          ospf6d=no
          bfdd=no

    - name: Configure relay EVPN route server
      ansible.builtin.copy:
        dest: /etc/frr/frr.conf
        mode: "0644"
        content: |
          frr version {{ frr_image.split(':')[-1] }}
          frr defaults traditional
          hostname relay
          log syslog informational
          no ipv6 forwarding
          router bgp 65100
           bgp router-id 10.44.44.254
           bgp log-neighbor-changes
           no bgp ebgp-requires-policy
           no bgp default ipv4-unicast
           neighbor 10.44.44.1 remote-as 65044
           neighbor 10.44.44.5 remote-as 65045
           neighbor 10.200.0.1 remote-as 65200
           neighbor 10.200.0.1 description workload-vtep
           neighbor 10.200.0.1 ebgp-multihop 4
           address-family l2vpn evpn
            neighbor 10.44.44.1 activate
            neighbor 10.44.44.1 next-hop-unchanged
            neighbor 10.44.44.5 activate
            neighbor 10.44.44.5 next-hop-unchanged
            neighbor 10.200.0.1 activate
            neighbor 10.200.0.1 next-hop-unchanged
           exit-address-family
          exit
          end

    - name: Start relay FRR
      ansible.builtin.systemd:
        name: frr-container.service
        state: restarted
        enabled: true
