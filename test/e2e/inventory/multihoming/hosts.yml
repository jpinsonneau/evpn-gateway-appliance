---
# CORENET-7502 CI inventory. The same playbook can target a qualification
# inventory later; only these environment-specific addresses/topology change.
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  children:
    onprem_appliances:
      hosts:
        appliance-a:
          ansible_host: 172.20.20.21
          # Per-appliance VTEP/router-id; this replaces the single tunnel.onprem_ip
          # used by the non-multihomed deployment model.
          evpn_underlay_ip: 10.44.44.1
          tunnel:
            type: direct-connect
            cloud_ip: 10.44.44.2
            network_cidr: 10.44.44.0/24
            underlay_interface: eth2
          bgp:
            onprem_asn: 65044
            infra_asn: 65100
            workload_asn: 65200
        appliance-b:
          ansible_host: 172.20.20.22
          evpn_underlay_ip: 10.44.44.5
          tunnel:
            type: direct-connect
            cloud_ip: 10.44.44.6
            network_cidr: 10.44.44.0/24
            underlay_interface: eth2
          bgp:
            onprem_asn: 65045
            infra_asn: 65100
            workload_asn: 65200
    evpn_relays:
      hosts:
        relay:
          ansible_host: 172.20.20.23
          private_ip: 10.200.0.2
    cloud_workload:
      hosts:
        workload:
          ansible_host: 172.20.20.25
          private_ip: 10.200.0.1
    edge_hosts:
      hosts:
        edge-host:
          ansible_host: 172.20.20.24
