---
# Full deploy — idempotent, safe to re-run. The cloud_infra play is skipped when
# an inventory intentionally provides a test/qualification relay instead; the
# cloud workload and all on-prem appliances still use this public deploy path.
# Usage: ansible-playbook playbooks/deploy.yml

- name: Deploy cloud infra (EVPN relay + WireGuard)
  hosts: cloud_infra
  become: true
  pre_tasks:
    # Monitoring uses ansible_facts.services to select its runtime.
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_infra
    - evpn_monitoring

- name: Deploy cloud workload (EVPN VTEP)
  hosts: cloud_workload
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_workload
    - evpn_monitoring

- name: Deploy on-prem appliance (EVPN VTEP + VLAN trunk)
  hosts: onprem_appliances
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_onprem_appliance
    - evpn_monitoring

- name: Wait for EVPN convergence
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait 15 seconds for BGP EVPN to converge
      ansible.builtin.pause:
        seconds: 15

- name: Health checks
  hosts: all
  become: true
  tasks:
    - name: Run EVPN fabric health checks
      ansible.builtin.include_role:
        name: evpn_health_check
      when: evpn_deploy_run_health_checks | default(true) | bool
